<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="PACK&GO 團體行程與旅行服務" />
  <title>PACK&GO 旅行社</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* THROWAWAY PROTOTYPE: Three PACK&GO design directions, switchable with ?variant=. */
    :root {
      --ink: #11110f;
      --muted: #6d6b65;
      --line: #dedbd3;
      --paper: #f5f2eb;
      --white: #fff;
      --soft: #ebe7de;
      --success: #2e6944;
      --warning: #8b5c17;
      --radius-sm: 12px;
      --radius-md: 18px;
      --radius-lg: 28px;
      --shadow: 0 16px 50px rgba(31, 28, 22, .08);
      --max: 1440px;
      --serif: "Noto Serif TC", Georgia, serif;
      --sans: "Noto Sans TC", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.55;
      padding-bottom: 88px;
    }
    button, input, select { font: inherit; }
    button, a, select { -webkit-tap-highlight-color: transparent; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    img { display: block; width: 100%; }
    h1, h2, h3, p { margin-top: 0; }
    h1, h2, h3 { text-wrap: balance; }
    .serif { font-family: var(--serif); }
    .muted { color: var(--muted); }
    .eyebrow {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .17em;
      text-transform: uppercase;
    }
    .shell { width: min(var(--max), calc(100% - 32px)); margin: 0 auto; }
    .section { padding: 76px 0; }
    .section-tight { padding: 42px 0; }
    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 28px;
    }
    .section-head h2 { margin: 0; font-family: var(--serif); font-size: clamp(29px, 3vw, 48px); line-height: 1.16; }
    .section-head p { max-width: 600px; margin: 0; color: var(--muted); }
    .hairline { border-top: 1px solid var(--line); }

    .btn {
      display: inline-flex;
      min-height: 46px;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 0 19px;
      border: 1px solid var(--ink);
      border-radius: var(--radius-sm);
      background: var(--ink);
      color: var(--white);
      font-weight: 700;
      transition: transform .18s ease, background .18s ease, color .18s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn.light { border-color: rgba(255,255,255,.72); background: rgba(255,255,255,.94); color: var(--ink); }
    .btn.ghost { border-color: var(--line); background: var(--white); color: var(--ink); }
    .btn.ghost-dark { border-color: rgba(255,255,255,.45); background: rgba(0,0,0,.22); color: var(--white); }
    .btn.small { min-height: 38px; padding: 0 14px; font-size: 13px; }
    .btn.wide { width: 100%; }
    .link-button { border: 0; background: none; padding: 4px 0; font-weight: 700; color: inherit; }
    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255,255,255,.88);
      color: var(--ink);
      font-size: 12px;
      font-weight: 700;
    }

    .utility {
      position: relative;
      z-index: 30;
      min-height: 34px;
      background: var(--ink);
      color: rgba(255,255,255,.82);
      font-size: 12px;
    }
    .utility-inner {
      width: min(var(--max), calc(100% - 32px));
      min-height: 34px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .utility-actions { display: flex; align-items: center; gap: 9px; }
    .utility select {
      height: 27px;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 9px;
      background: #1c1c1a;
      color: var(--white);
      padding: 0 23px 0 8px;
      font-size: 11px;
    }
    .main-nav {
      position: sticky;
      top: 0;
      z-index: 25;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.94);
      backdrop-filter: blur(14px);
    }
    .nav-inner {
      width: min(var(--max), calc(100% - 32px));
      min-height: 78px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 280px 1fr 280px;
      align-items: center;
      gap: 20px;
    }
    .brand { display: inline-flex; align-items: center; gap: 12px; width: fit-content; }
    .brand img { width: 38px; height: 48px; object-fit: contain; }
    .brand strong { display: block; font-size: 20px; letter-spacing: .02em; line-height: 1.05; }
    .brand small { display: block; margin-top: 5px; color: var(--muted); font-size: 11px; }
    .nav-links { display: flex; justify-content: center; gap: 30px; }
    .nav-link {
      border: 0;
      border-radius: 9px;
      background: transparent;
      padding: 8px 10px;
      color: #363532;
      font-weight: 600;
    }
    .nav-link:hover, .nav-link.active { background: var(--paper); color: var(--ink); }
    .nav-actions { display: flex; align-items: center; justify-content: flex-end; gap: 9px; }
    .mobile-menu { display: none; }

    .hero-photo { position: relative; overflow: hidden; border-radius: var(--radius-lg); background: #222; }
    .hero-photo > img { height: 100%; object-fit: cover; }
    .image-shade::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(4,4,3,.82) 0%, rgba(4,4,3,.3) 55%, rgba(4,4,3,.05) 100%);
      pointer-events: none;
    }
    .hero-copy { position: absolute; z-index: 2; color: var(--white); }
    .hero-copy h1 { margin-bottom: 18px; font-family: var(--serif); font-size: clamp(42px, 6.1vw, 88px); line-height: 1.04; letter-spacing: -.03em; }
    .hero-copy p { max-width: 680px; color: rgba(255,255,255,.84); font-size: 17px; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
    .offer-line { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; font-weight: 700; }

    .search-bar {
      position: relative;
      z-index: 4;
      display: grid;
      grid-template-columns: 1.5fr 1fr auto;
      align-items: stretch;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--white);
      box-shadow: var(--shadow);
    }
    .search-cell { padding: 16px 20px; border-right: 1px solid var(--line); }
    .search-cell label { display: block; margin-bottom: 3px; color: var(--muted); font-size: 11px; font-weight: 700; }
    .search-cell input { width: 100%; border: 0; outline: 0; background: transparent; color: var(--ink); }
    .search-bar .btn { margin: 8px; min-width: 128px; }

    .tour-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
    .tour-grid.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .tour-card { overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--white); }
    .tour-card-media { position: relative; overflow: hidden; aspect-ratio: 4 / 3; }
    .tour-card-media img { height: 100%; object-fit: cover; transition: transform .35s ease; }
    .tour-card:hover .tour-card-media img { transform: scale(1.025); }
    .tour-card-media .chip { position: absolute; top: 12px; right: 12px; }
    .tour-card-body { padding: 16px 17px 18px; }
    .tour-card-body h3 { min-height: 51px; margin: 5px 0 8px; font-family: var(--serif); font-size: 20px; line-height: 1.3; }
    .card-meta { display: flex; flex-wrap: wrap; gap: 5px 12px; color: var(--muted); font-size: 13px; }
    .card-price { display: flex; align-items: end; justify-content: space-between; gap: 12px; margin-top: 14px; }
    .card-price strong { font-family: var(--serif); font-size: 23px; }

    .trust-strip {
      display: grid;
      grid-template-columns: 1.3fr repeat(3, 1fr);
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--white);
    }
    .trust-story { position: relative; min-height: 340px; overflow: hidden; }
    .trust-story img { height: 100%; object-fit: cover; }
    .trust-story-copy { position: absolute; inset: auto 20px 20px; padding: 18px; border-radius: var(--radius-md); background: rgba(255,255,255,.92); }
    .trust-item { padding: 34px 24px; border-left: 1px solid var(--line); }
    .trust-item b { display: block; margin-bottom: 12px; font-family: var(--serif); font-size: 22px; }

    .page-banner { padding: 48px 0 22px; }
    .page-banner-grid { display: grid; grid-template-columns: 1.1fr 1.9fr; gap: 22px; align-items: stretch; }
    .page-banner-copy { display: flex; flex-direction: column; justify-content: center; padding: 34px; border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--white); }
    .page-banner-copy h1 { margin: 0 0 12px; font-family: var(--serif); font-size: clamp(38px, 5vw, 68px); line-height: 1.05; }
    .banner-collage { display: grid; grid-template-columns: 1.5fr 1fr; gap: 10px; }
    .banner-collage img { height: 280px; object-fit: cover; border-radius: var(--radius-lg); }
    .filter-row {
      position: sticky;
      top: 78px;
      z-index: 15;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      margin: 22px 0 30px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: rgba(245,242,235,.94);
      backdrop-filter: blur(12px);
    }
    .filter-search { display: flex; align-items: center; gap: 10px; padding: 0 14px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--white); }
    .filter-search input { width: 100%; border: 0; outline: 0; background: transparent; }
    .filter-buttons { display: flex; flex-wrap: wrap; gap: 8px; }
    .prototype-notice {
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:18px;
      margin:18px 0;
      padding:14px 16px;
      border:1px solid #c9b997;
      border-radius:16px;
      background:#eee4cf;
      color:#4e432f;
      font-size:12px;
      line-height:1.65;
    }
    .prototype-notice b { white-space:nowrap; }
    .catalog-signals { display:flex; flex-wrap:wrap; gap:7px; margin:10px 0; }
    .signal {
      display:inline-flex;
      align-items:center;
      min-height:27px;
      padding:0 9px;
      border:1px solid var(--line);
      border-radius:999px;
      background:#f7f5ef;
      color:#55524b;
      font-size:11px;
      font-weight:700;
    }
    .signal.ok { border-color:#b7cbbb; background:#edf4ee; color:#28583a; }
    .signal.wait { border-color:#d7c398; background:#f6efe0; color:#78531e; }
    .departure-preview { display:grid; gap:5px; max-width:360px; margin-top:11px; }
    .departure-mini { display:flex; align-items:center; justify-content:space-between; gap:14px; color:var(--muted); font-size:12px; }
    .departure-mini b { color:var(--ink); font-size:11px; }

    .detail-hero { padding: 28px 0 0; }
    .breadcrumbs { margin-bottom: 18px; color: var(--muted); font-size: 12px; }
    .gallery-a { display: grid; grid-template-columns: 1.65fr .75fr; gap: 10px; }
    .gallery-a > img, .gallery-stack img { width: 100%; object-fit: cover; border-radius: var(--radius-lg); }
    .gallery-a > img { height: 520px; }
    .gallery-stack { display: grid; gap: 10px; }
    .gallery-stack img { height: 255px; }
    .detail-summary {
      position: relative;
      z-index: 4;
      display: grid;
      grid-template-columns: 1.4fr 1fr auto;
      align-items: center;
      gap: 20px;
      margin: -34px 24px 0;
      padding: 26px;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: rgba(255,255,255,.96);
      box-shadow: var(--shadow);
    }
    .detail-summary h1 { margin: 0 0 8px; font-family: var(--serif); font-size: clamp(31px, 3.6vw, 52px); line-height: 1.14; }
    .summary-facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .summary-fact { padding-left: 16px; border-left: 1px solid var(--line); }
    .summary-fact span { display: block; color: var(--muted); font-size: 11px; }
    .summary-fact strong { display: block; margin-top: 4px; font-family: var(--serif); font-size: 22px; }
    .summary-cta { display: grid; gap: 8px; min-width: 190px; }

    .highlight-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    .highlight-card { overflow: hidden; border-radius: var(--radius-md); background: var(--white); border: 1px solid var(--line); }
    .highlight-card img { aspect-ratio: 16 / 10; height: auto; object-fit: cover; }
    .highlight-copy { padding: 16px; }
    .highlight-copy h3 { margin-bottom: 7px; font-family: var(--serif); font-size: 21px; }
    .highlight-copy p { margin: 0; color: var(--muted); }

    .journey-layout { display: grid; grid-template-columns: 1.05fr .95fr; gap: 22px; align-items: start; }
    .journey-visual { overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--white); }
    .journey-visual > img { aspect-ratio: 16 / 10; object-fit: cover; }
    .journey-caption { padding: 18px 20px; }
    .journey-caption h3 { margin: 0 0 6px; font-family: var(--serif); font-size: 26px; }
    .day-strip { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
    .day-thumb { overflow: hidden; border: 1px solid transparent; border-radius: var(--radius-sm); background: transparent; padding: 0; text-align: left; }
    .day-thumb img { aspect-ratio: 4/3; object-fit: cover; }
    .day-thumb span { display: block; padding: 7px 8px; font-size: 11px; }
    .day-thumb.active { border-color: var(--ink); background: var(--paper); }
    .route-map { position: sticky; top: 154px; overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius-lg); background: #efeae0; }
    .route-map-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.72); }
    .route-map svg { display: block; width: 100%; height: auto; }
    .route-line { fill: none; stroke: #23221f; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 8 8; }
    .map-pin { fill: #fff; stroke: #111; stroke-width: 3; transition: .2s ease; }
    .map-pin.active { fill: #111; r: 18; }
    .map-num { fill: #111; font: 700 13px var(--sans); text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
    .map-num.active { fill: #fff; }
    .map-label { fill: #333; font: 600 12px var(--sans); }

    .decision-grid { display: grid; grid-template-columns: .8fr 1.5fr .8fr; gap: 18px; }
    .decision-card { padding: 22px; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--white); }
    .decision-card h3 { margin: 0 0 14px; font-family: var(--serif); font-size: 22px; }
    .date-row, .cost-row { display: flex; align-items: center; justify-content: space-between; gap: 15px; padding: 11px 0; border-top: 1px solid var(--line); }
    .cost-cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; border-top: 1px solid var(--line); }
    .cost-col { padding: 14px 14px 0; border-left: 1px solid var(--line); }
    .cost-col:first-child { border-left: 0; padding-left: 0; }
    .cost-col b { display: block; margin-bottom: 7px; }
    .cost-col p { margin: 4px 0; color: var(--muted); font-size: 12px; }
    .total-price { font-family: var(--serif); font-size: 34px; }
    .decision-passport {
      display:grid;
      grid-template-columns:1.15fr repeat(4,1fr);
      overflow:hidden;
      margin-top:14px;
      border:1px solid var(--line);
      border-radius:22px;
      background:#fff;
      box-shadow:0 14px 44px rgba(31,28,22,.045);
    }
    .passport-intro, .passport-fact { padding:18px 20px; }
    .passport-fact { border-left:1px solid var(--line); }
    .passport-intro h2 { margin:0 0 4px; font-family:var(--serif); font-size:25px; }
    .passport-intro p, .passport-fact small { display:block; margin:0; color:var(--muted); font-size:11px; }
    .passport-fact b { display:block; margin-top:8px; font-size:14px; line-height:1.5; }

    .membership-hero {
      overflow: hidden;
      border-radius: var(--radius-lg);
      background: var(--ink);
      color: var(--white);
      text-align: center;
    }
    .membership-copy { padding: 64px 24px 38px; }
    .membership-copy h1 { margin-bottom: 16px; font-family: var(--serif); font-size: clamp(38px, 5vw, 68px); }
    .membership-copy p { max-width: 760px; margin: 0 auto; color: rgba(255,255,255,.72); }
    .membership-photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 8px; }
    .membership-photos img { height: 210px; object-fit: cover; border-radius: var(--radius-md); }
    .plan-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 20px; }
    .plan-card { display: flex; flex-direction: column; padding: 26px; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--white); }
    .plan-card.featured { border-color: var(--ink); box-shadow: 0 0 0 2px var(--ink) inset; }
    .plan-card h2 { margin: 0; font-family: var(--serif); font-size: 30px; }
    .plan-price { margin: 12px 0 18px; font-family: var(--serif); font-size: 36px; }
    .plan-card ul { flex: 1; margin: 0 0 24px; padding-left: 20px; color: #3d3c38; }
    .plan-card li { margin: 9px 0; }

    .member-layout { display: grid; grid-template-columns: 230px 1fr; gap: 20px; padding: 36px 0 72px; }
    .member-rail { position: sticky; top: 104px; height: fit-content; padding: 18px; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--white); }
    .member-rail h3 { margin: 0 0 16px; font-family: var(--serif); }
    .rail-link { display: flex; width: 100%; justify-content: space-between; border: 0; border-radius: 10px; background: transparent; padding: 10px; text-align: left; }
    .rail-link.active { background: var(--paper); font-weight: 700; }
    .member-main { min-width: 0; }
    .member-head { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
    .member-head h1 { margin: 0; font-family: var(--serif); font-size: 48px; }
    .upcoming-trip { display: grid; grid-template-columns: 1.25fr .95fr; overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--white); }
    .upcoming-trip img { height: 100%; min-height: 360px; object-fit: cover; }
    .trip-copy { display: flex; flex-direction: column; justify-content: center; padding: 34px; }
    .trip-copy h2 { margin: 9px 0; font-family: var(--serif); font-size: 32px; }
    .progress-line { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; margin-top: 26px; }
    .progress-step { position: relative; padding-top: 24px; color: var(--muted); font-size: 11px; }
    .progress-step::before { content:""; position:absolute; top:7px; left:7px; right:-7px; height:1px; background: var(--line); }
    .progress-step::after { content:""; position:absolute; top:0; left:0; width:15px; height:15px; border:1px solid var(--ink); border-radius:50%; background:var(--white); }
    .progress-step.done { color: var(--ink); font-weight: 700; }
    .progress-step.done::after { background: var(--ink); box-shadow: inset 0 0 0 4px var(--white); }
    .member-info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 18px; }
    .list-panel { padding: 22px; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--white); }
    .list-panel h3 { margin: 0 0 12px; font-family: var(--serif); font-size: 22px; }
    .list-row { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 13px 0; border-top: 1px solid var(--line); }
    .list-row small { color: var(--muted); }

    /* Variant B: selected B+C hybrid. Cinema sells desire; atlas closes the decision. */
    .variant-b { background:#f1eee7; color:var(--ink); }
    .variant-b .eyebrow { letter-spacing:.09em; text-transform:none; }
    .variant-b .utility { background:#060606; }
    .variant-b .main-nav { top:8px; width:calc(100% - 24px); margin:8px 12px 0; border:1px solid rgba(255,255,255,.14); border-radius:18px; background:rgba(15,15,14,.96); color:#fff; box-shadow:0 12px 36px rgba(0,0,0,.12); }
    .variant-b .nav-inner { width:calc(100% - 28px); min-height:72px; }
    .variant-b .brand img { filter:invert(1); }
    .variant-b .brand strong { color:#fff; }
    .variant-b .brand small { color:rgba(255,255,255,.58); }
    .variant-b .nav-link { color:rgba(255,255,255,.76); }
    .variant-b .nav-link:hover, .variant-b .nav-link.active { background:rgba(255,255,255,.1); color:#fff; }
    .variant-b .nav-actions .btn.ghost { border-color:rgba(255,255,255,.28); background:transparent; color:#fff; }
    .variant-b .cinema-hero { position:relative; min-height:calc(100svh - 132px); margin:12px; overflow:hidden; border-radius:30px; background:#111; color:#fff; }
    .variant-b .cinema-hero > img { position:absolute; inset:0; height:100%; object-fit:cover; opacity:.96; }

        payments:{A:memberA,B:memberB,C:memberC,BC:paymentsBC},

      const isBC = state.variant === "BC";

      const appRoot = document.getElementById("app");
      const renderBackground = !preserveBackground || !appRoot.hasChildNodes();
      if (renderBackground) {
        if (typeof bcDestroyRegionalExplorer === "function") bcDestroyRegionalExplorer();
        if (typeof bcDestroyMapLayoutLab === "function") bcDestroyMapLayoutLab();
        // 上線守門(2026-07-29):還沒接上真實系統的畫面,正式站不輸出示範內容。
        const notLive =
          typeof BC_NOT_LIVE_VIEWS !== "undefined" &&

        if (isBC && typeof bcStripVisiblePunctuation === "function") bcStripVisiblePunctuation(appRoot);
        const prototypeSwitcher = document.getElementById("prototype-switcher");
        prototypeSwitcher.hidden = isBC;
        prototypeSwitcher.innerHTML = isBC ? "" : `<button data-variant-step="-1" aria-label="上一個版本">上</button><div class="prototype-label">${state.variant} ${L(variants[state.variant].zh,variants[state.variant].en)}<br><small>${L("本地版本比較", "Local version comparison")}</small></div><button data-variant-step="1" aria-label="下一個版本">下</button>`;
        if (isBC && routeChanged && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
          const motionRoot = appRoot.querySelector("main");
          motionRoot?.classList.add("bc-route-entering");
          setTimeout(() => {
            if (epoch === renderEpoch) motionRoot?.classList.remove("bc-route-entering");
          }, 340);
        }
      }
      renderPage.lastView = state.view;
      const overlayRoot = document.getElementById("overlay-root");
      overlayRoot.innerHTML = isBC ? `${bookingDrawerBC()}${bcShareDrawer()}` : bookingDrawer();
      if (typeof bcRemovePrototypeLanguage === "function") bcRemovePrototypeLanguage(overlayRoot);
      if (isBC && typeof bcLocalizeVisibleLanguage === "function") bcLocalizeVisibleLanguage(overlayRoot);
      if (isBC && typeof bcStripVisiblePunctuation === "function") bcStripVisiblePunctuation(overlayRoot);
      document.querySelectorAll(".bc-field, .bc-booking-drawer .field").forEach((field,index) => {
        const label = field.querySelector("label");
        const control = field.querySelector("input, select, textarea");
        if (!label || !control) return;
        control.id ||= `bc-field-${state.view}-${index + 1}`;
        label.htmlFor = control.id;
      });
      document.querySelectorAll("[data-catalog-search]").forEach(input => {
        input.setAttribute("aria-label", L("搜尋目的地 團名或特色", "Search destination journey or feature", "Buscar destino viaje o característica"));
      });
      const switcherRoot = document.getElementById("prototype-switcher");
      appRoot.inert = modalOpen;
      switcherRoot.inert = modalOpen;
      modalOpen ? appRoot.setAttribute("aria-hidden","true") : appRoot.removeAttribute("aria-hidden");
      requestAnimationFrame(() => {
        if (epoch !== renderEpoch) return;
        if (renderBackground && isBC && state.view === "home" && state.mapDesign === "D") bcMountRegionalExplorer();
        if (renderBackground && isBC && state.view === "detail" && typeof bcMountApprovedJourneyMap === "function") bcMountApprovedJourneyMap();
        if (renderBackground && isBC && state.view === "detail") bcMountDetailRouteMap();
        if (renderBackground && state.view === "map-layout-lab") bcMountMapLayoutLab();
        if (state.welcomeOpen && state.variant === "BC" && state.view === "home") {
          document.getElementById("bc-welcome-title")?.focus({preventScroll:true});
        } else if (state.shareOpen && state.shareFocusSelector) {
          document.querySelector(state.shareFocusSelector)?.focus();
          state.shareFocusSelector = "";
        } else if (state.shareReturnFocus) {
          [...document.querySelectorAll("[data-share]")].find(el => el.getClientRects().length)?.focus();
          state.shareReturnFocus = false;
        } else if (state.bookingOpen && state.bookingFocusSelector) {
          document.querySelector(state.bookingFocusSelector)?.focus();
          state.bookingFocusSelector = "";
        } else if (state.bookingReturnFocus) {
          const triggers = [...document.querySelectorAll("[data-book]")];
          const preferred = triggers[state.bookingTriggerIndex];
          (preferred?.getClientRects().length ? preferred : triggers.find(el => el.getClientRects().length))?.focus();
          state.bookingReturnFocus = false;
        } else if (state.uiFocusSelector) {
          document.querySelector(state.uiFocusSelector)?.focus({preventScroll:true});
          state.uiFocusSelector = "";
        }
        if (matchMedia("(max-width: 760px)").matches) {
          const active = document.querySelector(".bc-member-link.active");
          const rail = active?.parentElement;
          if (active && rail) rail.scrollLeft = Math.max(0, active.offsetLeft - (rail.clientWidth - active.clientWidth) / 2);

          const storyRail = activeStoryDay?.parentElement;
          if (activeStoryDay && storyRail) storyRail.scrollLeft = Math.max(0, activeStoryDay.offsetLeft - (storyRail.clientWidth - activeStoryDay.clientWidth) / 2);
        }
        if (finishMapStoryReturn) {
          setTimeout(() => {
            if (epoch !== renderEpoch || !state.mapStoryReturning) return;

            renderPage();

        state.mapStoryRefocus = false;

      if (isBC && typeof bcLocalizeVisibleLanguage === "function") {
        bcLocalizeVisibleLanguage(appRoot);
        bcLocalizeVisibleLanguage(overlayRoot);
      }
      updateUrl();
    }

    function changeVariant(delta) {
      const keys = ["A","B","C","BC"];
      const index = keys.indexOf(state.variant);
      state.variant = keys[(index + delta + keys.length) % keys.length];
      if (state.variant !== "BC" && state.tourId === 88) {
        state.tourId = 2;
        state.day = Math.min(state.day, days.length);
        state.poi = "";
      }
      state.mobileOpen = false;
      renderPage();
      window.scrollTo({top:0,behavior:"smooth"});
    }
    function toast(message) {
      const node = document.createElement("div"); node.className="toast"; node.textContent=message; document.body.appendChild(node); setTimeout(()=>node.remove(),1800);
    }

    function bcAnimatePress(event) {
      if (state.variant !== "BC" || event.button > 0 || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const target = event.target.closest("button, a[href], summary");
      if (!target || !target.closest(".variant-bc") || target.matches(":disabled, [aria-disabled='true']") || target.closest(".bc-layout-marker-labels, .bc-taiwan-route-poster, .bc-cohesive-a-actions")) return;
      const rect = target.getBoundingClientRect();
      const flare = document.createElement("span");
      flare.className = "bc-click-flare";
      flare.setAttribute("aria-hidden", "true");
      flare.style.setProperty("--bc-click-x", `${event.clientX - rect.left}px`);
      flare.style.setProperty("--bc-click-y", `${event.clientY - rect.top}px`);
      target.querySelector(":scope > .bc-click-flare")?.remove();
      target.classList.add("bc-click-motion");
      target.append(flare);
      flare.addEventListener("animationend", () => {
        flare.remove();
        target.classList.remove("bc-click-motion");
      }, {once:true});
      setTimeout(() => {
        flare.remove();
        target.classList.remove("bc-click-motion");
      }, 420);
    }

    document.addEventListener("pointerdown", bcAnimatePress, {capture:true});

    document.addEventListener("click", e => {
      const sectionLink = e.target.closest('.bc-detail-nav-sticky a[href^="#"]');
      if (sectionLink) {
        const hash = sectionLink.getAttribute("href");
        const target = hash && document.querySelector(hash);
        if (target) {
          e.preventDefault();
          target.scrollIntoView({
            behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth",
            block: "start"
          });
          history.replaceState(null, "", `${location.pathname}${location.search}${hash}`);
          if (e.detail === 0) {
            target.setAttribute("tabindex", "-1");
            setTimeout(() => target.focus({preventScroll:true}), 360);
          }
        }
        return;
      }
      const welcomeView = e.target.closest("[data-welcome-view]");
      if (welcomeView) { state.welcomeOpen=false; state.view=welcomeView.dataset.welcomeView; state.mobileOpen=false; renderPage(); window.scrollTo({top:0,behavior:"smooth"}); return; }
      if (e.target.closest("[data-welcome-close]")) { state.welcomeOpen=false; state.uiFocusSelector="#bc-home-redesign"; renderPage(); return; }
      const storyMedia = e.target.closest("[data-story-media]");
      if (storyMedia) { bcApplyTaiwanStoryMedia(storyMedia.dataset.storyMedia); return; }
      const orderLink = e.target.closest("[data-order]");
      if (orderLink) { state.orderId=orderLink.dataset.order; state.checkoutContext=null; state.view="order-detail"; state.mobileOpen=false; renderPage(); window.scrollTo({top:0,behavior:"smooth"}); return; }
      const checkoutLink = e.target.closest("[data-checkout]");
      if (checkoutLink) { state.orderId=checkoutLink.dataset.checkout; state.checkoutContext=null; state.checkoutStep=1; state.checkoutMethod=""; state.checkoutConsent=false; state.checkoutComplete=false; state.view="checkout"; state.mobileOpen=false; renderPage(); window.scrollTo({top:0,behavior:"smooth"}); return; }
      const flowAnswer = e.target.closest("[data-flow-answer]");
      if (flowAnswer) {
        const id=flowAnswer.dataset.flow;
        state.guidedFlows[id] ||= {step:0,answers:{}};
        if (id==="vip") state.guidedFlows[id].open=true;
        if (id==="custom" && flowAnswer.dataset.flowKey==="size" && state.guidedFlows[id].answers.size !== flowAnswer.dataset.flowAnswer) {
          state.guidedFlows[id]={step:0,answers:{}};
        }
        if (id==="china") {
          const order=["age","applicants","application","formerStatus","parentStatus","validity","date","rush"];
          const changedIndex=order.indexOf(flowAnswer.dataset.flowKey);
          if (changedIndex>=0 && state.guidedFlows[id].answers[flowAnswer.dataset.flowKey] !== flowAnswer.dataset.flowAnswer) {
            order.slice(changedIndex+1).forEach(key=>delete state.guidedFlows[id].answers[key]);
          }
        }
        state.guidedFlows[id].answers[flowAnswer.dataset.flowKey]=flowAnswer.dataset.flowAnswer;
        state.guidedFlows[id].step+=1;
        state.uiFocusSelector=state.guidedFlows[id].step >= Number(flowAnswer.dataset.flowLength) ? "#bc-flow-result" : "#bc-flow-question";
        renderPage();
        return;
      }
      const flowNext = e.target.closest("[data-flow-next]");
      if (flowNext) {
        const id=flowNext.dataset.flow;
        state.guidedFlows[id] ||= {step:0,answers:{}};
        if (id==="vip") state.guidedFlows[id].open=true;
        const key=flowNext.dataset.flowKey;
        if (key && !state.guidedFlows[id].answers[key]) state.guidedFlows[id].answers[key]=flowNext.dataset.flowDefault || "—";
        state.guidedFlows[id].step+=1;
        state.uiFocusSelector=state.guidedFlows[id].step >= Number(flowNext.dataset.flowLength) ? "#bc-flow-result" : "#bc-flow-question";
        renderPage();
        return;
      }
      const flowBack = e.target.closest("[data-flow-back]");
      if (flowBack) { const id=flowBack.dataset.flow; state.guidedFlows[id] ||= {step:0,answers:{}}; if (id==="vip") state.guidedFlows[id].open=true; state.guidedFlows[id].step=Math.max(0,state.guidedFlows[id].step-1); state.uiFocusSelector="#bc-flow-question"; renderPage(); return; }
      const flowReset = e.target.closest("[data-flow-reset]");
      if (flowReset) { const id=flowReset.dataset.flow; state.guidedFlows[id]={step:0,answers:{},open:id==="vip"}; if(id==="china"){state.chinaApplyOpen=false;state.chinaApplyStep=1;state.chinaIdentitySection=1;state.chinaApplyComplete=false;} state.uiFocusSelector="#bc-flow-question"; renderPage(); return; }
      if (e.target.closest("[data-china-apply-open]")) { state.chinaApplyOpen=true; state.chinaApplyStep=1; state.chinaIdentitySection=1; state.chinaApplyComplete=false; state.chinaApplyConsent=false; state.chinaApplySubmitConsent=false; state.uiFocusSelector="#bc-china-apply-title"; renderPage(); setTimeout(()=>document.getElementById("bc-china-application")?.scrollIntoView({behavior:"smooth",block:"start"}),80); return; }
      const chinaPayment = e.target.closest("[data-china-payment]");
      if (chinaPayment) { state.chinaApplyPayment=chinaPayment.dataset.chinaPayment; state.uiFocusSelector=`[data-china-payment="${state.chinaApplyPayment}"]`; renderPage(); return; }

      if (e.target.matches('input[data-checkout-consent]')) { state.checkoutConsent=e.target.checked; const finish=document.querySelector('[data-checkout-finish]'); if (finish) finish.disabled=!state.checkoutConsent; }
    });
    document.addEventListener("keydown", e => {
      if (e.key === "Escape" && state.welcomeOpen && state.variant === "BC" && state.view === "home") { e.preventDefault(); state.welcomeOpen=false; state.uiFocusSelector="#bc-home-redesign"; renderPage(); return; }
      if (e.key === "Escape" && state.shareOpen) { e.preventDefault(); state.shareOpen=false; state.shareFocusSelector=""; state.shareReturnFocus=true; renderPage(); return; }
      if (e.key === "Escape" && state.bookingOpen) { e.preventDefault(); state.bookingOpen=false; state.bookingReturnFocus=true; renderPage(true); return; }
      if (e.key === "Escape" && (state.mobileOpen || state.mobileFilters)) { e.preventDefault(); state.uiFocusSelector=state.mobileOpen?"#bc-more-menu":"[data-filter-toggle]"; state.mobileOpen=false; state.mobileFilters=false; renderPage(); return; }

      const storyDayControl = e.target.closest?.("[data-story-day]");
      if (storyDayControl && ["Enter"," "].includes(e.key)) { e.preventDefault(); const previousDay=state.day; const storyIsD=state.mapStoryDesign==="D" || (state.variant==="BC" && state.view==="detail"); const maxDays=state.view==="map-story-demo"?8:bcCurrentTour().days; const wasFocused=storyIsD && state.mapStoryFocus; state.day=Math.min(maxDays,Math.max(1,Number(storyDayControl.dataset.storyDay))); state.poi=""; state.storyItem=""; if (storyIsD) { state.mapStoryDesign="D"; state.mapStoryPreviousDay=previousDay; state.mapStoryFocus=true; state.mapStoryReturning=false; state.mapStoryRefocus=wasFocused; state.uiFocusSelector=""; } else state.uiFocusSelector="#bc-map-story-title"; renderPage(); if (storyIsD) focusStoryDayAfterRender(); return; }
      if (storyDayControl && ["ArrowLeft","ArrowRight"].includes(e.key)) { e.preventDefault(); const delta=e.key==="ArrowRight"?1:-1; const previousDay=state.day; const storyIsD=state.mapStoryDesign==="D" || (state.variant==="BC" && state.view==="detail"); const maxDays=state.view==="map-story-demo"?8:bcCurrentTour().days; const wasFocused=storyIsD && state.mapStoryFocus; state.day=((Number(storyDayControl.dataset.storyDay)-1+delta+maxDays)%maxDays)+1; state.poi=""; state.storyItem=""; if (storyIsD) { state.mapStoryDesign="D"; state.mapStoryPreviousDay=previousDay; state.mapStoryFocus=true; state.mapStoryReturning=false; state.mapStoryRefocus=wasFocused; state.uiFocusSelector=""; } else state.uiFocusSelector=storyDayControl.matches(".bc-taiwan-poster-day")?`.bc-taiwan-poster-day[data-story-day="${state.day}"]`:storyDayControl.matches(".bc-photo-ribbon-day")?`.bc-photo-ribbon-day[data-story-day="${state.day}"]`:`.bc-map-story-day[data-story-day="${state.day}"]`; renderPage(); if (storyIsD) focusStoryDayAfterRender(); return; }
      const taiwanDayMarker = e.target.closest?.(".bc-taiwan-poster-day[data-day]");
      if (taiwanDayMarker && ["Enter"," "].includes(e.key)) { e.preventDefault(); state.day=Number(taiwanDayMarker.dataset.day); state.poi=""; state.uiFocusSelector=`#bc-day-${state.day}`; renderPage(); return; }
      if (taiwanDayMarker && ["ArrowLeft","ArrowRight"].includes(e.key)) { e.preventDefault(); const delta=e.key==="ArrowRight"?1:-1; state.day=((Number(taiwanDayMarker.dataset.day)-1+delta+8)%8)+1; state.poi=""; state.uiFocusSelector=`.bc-taiwan-poster-day[data-day="${state.day}"]`; renderPage(); return; }
      if (e.key === "Tab" && state.bookingOpen) {
        const focusable = [...document.querySelectorAll('.booking-drawer button:not([disabled]), .booking-drawer input:not([disabled]), .booking-drawer select:not([disabled]), .booking-drawer textarea:not([disabled]), .booking-drawer [tabindex]')].filter(el => el.getClientRects().length);
        const first = focusable[0], last = focusable.at(-1);
        if (first && (e.shiftKey && document.activeElement === first || !e.shiftKey && document.activeElement === last)) { e.preventDefault(); (e.shiftKey ? last : first).focus(); }
      }
      if (e.key === "Tab" && state.welcomeOpen && state.variant === "BC" && state.view === "home") {
        const focusable = [...document.querySelectorAll('.bc-welcome-dialog button:not([disabled]), .bc-welcome-dialog [tabindex]:not([tabindex="-1"])')].filter(el => el.getClientRects().length);
        const first = focusable[0], last = focusable.at(-1);
        if (first && (e.shiftKey && document.activeElement === first || !e.shiftKey && document.activeElement === last)) { e.preventDefault(); (e.shiftKey ? last : first).focus(); }
      }
      if (e.key === "Tab" && state.shareOpen) {
        const focusable = [...document.querySelectorAll('.bc-share-drawer button:not([disabled]), .bc-share-drawer [tabindex]:not([tabindex="-1"])')].filter(el => el.getClientRects().length);
        const first = focusable[0], last = focusable.at(-1);
        if (first && (e.shiftKey && document.activeElement === first || !e.shiftKey && document.activeElement === last)) { e.preventDefault(); (e.shiftKey ? last : first).focus(); }
      }
      if (e.key === "Tab" && state.mobileOpen && state.variant === "BC" && matchMedia("(max-width: 900px)").matches) {
        const focusable = [...document.querySelectorAll('#bc-site-menu button:not([disabled]), #bc-site-menu select:not([disabled]), #bc-site-menu a[href], #bc-site-menu [tabindex]:not([tabindex="-1"])')].filter(el => el.getClientRects().length);
        const first = focusable[0], last = focusable.at(-1);
        if (first && (e.shiftKey && document.activeElement === first || !e.shiftKey && document.activeElement === last)) { e.preventDefault(); (e.shiftKey ? last : first).focus(); }
      }
      const tag = document.activeElement?.tagName;
      if (["INPUT","TEXTAREA","SELECT"].includes(tag) || document.activeElement?.isContentEditable) return;
      if (state.memberLab && state.variant === "BC" && state.view === "member" && ["ArrowLeft","ArrowRight"].includes(e.key)) { e.preventDefault(); const keys=["A","B","C"]; const index=keys.indexOf(state.memberDesign); state.memberDesign=keys[(index+(e.key==="ArrowRight"?1:-1)+keys.length)%keys.length]; state.uiFocusSelector="#bc-member-design"; renderPage(); return; }
      if (state.catalogLab && state.variant === "BC" && state.view === "home" && ["ArrowLeft","ArrowRight"].includes(e.key)) { e.preventDefault(); const keys=["A","B","C"]; const index=keys.indexOf(state.catalogDesign); state.catalogDesign=keys[(index+(e.key==="ArrowRight"?1:-1)+keys.length)%keys.length]; state.uiFocusSelector="#bc-scale-catalog"; renderPage(); return; }
      if (state.ctaLab && state.variant === "BC" && state.view === "home" && ["ArrowLeft","ArrowRight"].includes(e.key)) { e.preventDefault(); const keys=["A","B","C","D"]; const index=keys.indexOf(state.ctaDesign); state.ctaDesign=keys[(index+(e.key==="ArrowRight"?1:-1)+keys.length)%keys.length]; state.uiFocusSelector="#bc-cta-lab-switcher"; renderPage(); return; }
      if (state.homeLab && state.variant === "BC" && state.view === "home" && ["ArrowLeft","ArrowRight"].includes(e.key)) { e.preventDefault(); const keys=["A","B","C"]; const index=keys.indexOf(state.homeDesign); state.homeDesign=keys[(index+(e.key==="ArrowRight"?1:-1)+keys.length)%keys.length]; state.uiFocusSelector="#bc-home-redesign"; renderPage(); return; }
      if (state.membershipLab && state.variant === "BC" && state.view === "membership" && ["ArrowLeft","ArrowRight"].includes(e.key)) { e.preventDefault(); const keys=["A","B","C"]; const index=keys.indexOf(state.membershipDesign); state.membershipDesign=keys[(index+(e.key==="ArrowRight"?1:-1)+keys.length)%keys.length]; state.uiFocusSelector="#bc-membership-design"; renderPage(); return; }
      if (state.mapLab && state.variant === "BC" && state.view === "home" && ["ArrowLeft","ArrowRight"].includes(e.key)) { e.preventDefault(); const keys=["A","B","C","D"]; const index=keys.indexOf(state.mapDesign); state.mapDesign=keys[(index+(e.key==="ArrowRight"?1:-1)+keys.length)%keys.length]; state.mapScope="region"; state.mapDay=1; state.uiFocusSelector="#bc-world-map"; renderPage(); return; }
      if (state.mapStoryLab && state.variant === "BC" && state.view === "map-story-demo" && ["ArrowLeft","ArrowRight"].includes(e.key) && (e.target === document.body || e.target.closest?.(".bc-map-story-design-switcher"))) { e.preventDefault(); const keys=["A","B","C","D"]; const index=keys.indexOf(state.mapStoryDesign); state.mapStoryDesign=keys[(index+(e.key==="ArrowRight"?1:-1)+keys.length)%keys.length]; state.mapStoryFocus=false; state.mapStoryReturning=false; state.mapStoryRefocus=false; state.uiFocusSelector='.bc-map-story-design-switcher [data-map-story-step="1"]'; renderPage(); return; }
      if (["ArrowLeft","ArrowRight"].includes(e.key) && e.target.closest?.(".bc-map-story-lab")) return;
      if (e.key === "ArrowLeft") changeVariant(-1);
      if (e.key === "ArrowRight") changeVariant(1);
    });
    window.addEventListener("popstate", () => location.reload());
    renderPage();
  </script>
